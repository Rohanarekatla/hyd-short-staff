<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SurgeForce · Hyderabad</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <header>
    <div class="brand"><b>SurgeForce</b><span>Hyderabad flood staffing command</span></div>
    <div class="controls">
      <div class="seg" id="mode">
        <button data-v="replay" class="on">Replay 31 Aug 2024</button>
        <button data-v="live">Live forecast</button>
      </div>
      <div class="seg" id="quant" title="Cost of a wasted deployment : loss from an unprepared flood. Act when probability ≥ this ratio.">
        <span class="ctl" style="padding:0 6px">False alarm : miss</span>
        <button data-v="0.05">1:20</button><button data-v="0.1" class="on">1:10</button><button data-v="0.2">1:5</button><button data-v="0.33">1:3</button>
      </div>
      <label class="ctl">Station offline <select id="offline"><option value="">none</option></select></label>
      <label class="ctl">Volunteer no-show <input id="noshow" type="range" min="0" max="0.6" step="0.1" value="0"><output id="noshowOut">0%</output></label>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <section class="kpis" id="kpis"></section>
  <main>
    <div class="left">
      <div id="map"></div>
      <div class="fan"><div class="fanhead"><b>City rainfall: every forecast member</b><span id="fanNote"></span></div><svg id="fan" viewBox="0 0 600 150" preserveAspectRatio="none"></svg></div>
    </div>
    <aside>
      <nav id="tabs">
        <button data-t="timeline" class="on">Timeline</button><button data-t="pairs">Counterparts</button>
        <button data-t="teams">Teams</button><button data-t="reports">Reports</button>
        <button data-t="alerts">Alerts</button><button data-t="evidence">Evidence</button><button data-t="copilot">AI Assistant</button><button data-t="method">Method</button>
      </nav>
      <div id="panel" class="panel"></div>
    </aside>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app/app.js"></script>
</body>
</html>
